version: 1
server:
  name: node-filesystem
  command: node
  args: ["dist/index.js", "."]
  workspace:
    source: pilot-servers/src/filesystem
    mode: copy
policy:
  read_paths:
    - ${WORKSPACE}
  write_paths:
    - ${WORKSPACE}
  allowed_child_binaries: []
  allow_network: false
  allowed_unix_sockets: []
