name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Unit Tests
        run: |
          cargo test --workspace -- --test-threads=1 --nocapture > test.log 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            tail -n 50 test.log || true
            sleep 10
          done
          wait $PID
