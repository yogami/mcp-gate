name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mcp-gate
        run: cargo build

      - name: Run Test Trace
        run: |
          RUST_LOG=trace cargo test --test benign_server p3_ben_01_benign_server_zero_findings -- --nocapture > test.log 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            cat test.log
            sleep 5
          done
          wait $PID
