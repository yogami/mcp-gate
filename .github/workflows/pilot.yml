name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mcp-gate
        run: cargo build --release
      
      - name: Run filesystem server
        timeout-minutes: 2
        run: |
          git clone https://github.com/modelcontextprotocol/servers.git pilot-servers
          cd pilot-servers/src/filesystem
          npm install && npm run build
          cd ../../..
          cat << 'CONFIG' > fs-gate.yaml
          version: 1
          server:
            name: node-filesystem
            command: node
            args: ["dist/index.js", "."]
            workspace:
              source: pilot-servers/src/filesystem
              mode: copy
          policy:
            read_paths:
              - ${WORKSPACE}
            write_paths:
              - ${WORKSPACE}
            allowed_child_binaries: []
            allow_network: false
            allowed_unix_sockets: []
          timeout 30s strace -f -o mcp-gate.strace target/release/mcp-gate run --config fs-gate.yaml --sarif fs.sarif || true
          cat mcp-gate.strace || true



      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-sarifs
          path: "*.sarif"
