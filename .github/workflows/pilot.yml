name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mcp-gate
        run: cargo build

      - name: Run Test Trace
        run: |
          export GITHUB_ACTIONS=false
          cargo test --workspace -- --nocapture
