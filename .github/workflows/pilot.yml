name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mcp-gate
        run: cargo build

      - name: Run Test Trace
        run: |
          RUST_LOG=trace target/debug/mcp-gate run --config tests/configs/valid/benign.yaml > mcp-gate.log 2>&1 &
          PID=$!
          
          # Print the log file as it grows
          tail -f mcp-gate.log &
          TAIL_PID=$!
          
          # Wait for up to 60 seconds
          for i in {1..60}; do
            if ! kill -0 $PID 2>/dev/null; then
              break
            fi
            sleep 1
          done
          
          if kill -0 $PID 2>/dev/null; then
            echo "mcp-gate run is hanging!"
            kill -9 $PID
          fi
          
          kill -9 $TAIL_PID 2>/dev/null || true
          cat mcp-gate.log
