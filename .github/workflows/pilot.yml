name: Pilot

on:
  push:
    branches:
      - pilot-eval

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mcp-gate
        run: cargo build

      - name: Run Test Trace
        env:
          GITHUB_ACTIONS: "false"
        run: cargo test --workspace -- --nocapture
