name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    name: domain (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version

      - name: Code formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Check traceability coverage
        run: ./scripts/check-test-ids.sh P0-SPIKE-01..10 P1-ENV-01..13 P1-PATH-01..15 P1-CONT-01..05 P1-CFG-01..03 P1-EXIT-01 P1-CAN-01..06 P1-SEED-01..04 P1-POL-01..04 P2-LAUNCH-01..06

      - name: Safety check (forbid unsafe)
        run: bash scripts/tests/forbid_unsafe_test.sh

      - name: Traceability script test
        run: bash scripts/tests/check_test_ids_test.sh

      - name: Runner compatibility script test
        run: bash scripts/tests/render_compat_test.sh

  linux-integration:
    name: linux-integration (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Test workspace
        run: cargo test --workspace

  coverage:
    name: coverage
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustc --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --fail-under-lines 80 --ignore-filename-regex '(spikes|fixtures)/'

  probe:
    name: probe (${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Run mcp-gate probe
        run: |
          mkdir -p probe-results
          cargo run -q --bin mcp-gate -- probe > probe-results/probe-${{ matrix.os }}.json

      - name: Validate probe output
        run: |
          jq -e .supported probe-results/probe-${{ matrix.os }}.json
          jq -e '.missing == []' probe-results/probe-${{ matrix.os }}.json

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: probe-results/
