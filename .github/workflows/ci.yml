name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain:
    name: domain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version

      - name: Code formatting
        run: cargo fmt --all --check

      - name: Clippy lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Safety check (forbid unsafe)
        run: bash scripts/tests/forbid_unsafe_test.sh

      - name: Traceability script test
        run: bash scripts/tests/check_test_ids_test.sh

      - name: Runner compatibility script test
        run: bash scripts/tests/render_compat_test.sh

  linux-integration:
    name: linux-integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Test workspace
        run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustc --version

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Measure coverage
        run: cargo llvm-cov --workspace --fail-under-lines 80 --ignore-filename-regex '(spikes|fixtures)/'
