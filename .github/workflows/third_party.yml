name: Third-Party MCP Integration

on:
  push:
    branches:
      - pilot-eval
  workflow_dispatch:

jobs:
  test-sqlite-server:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc --version
          cargo --version

      - name: Build mcp-gate
        run: cargo build --release

      - name: Create Config
        run: |
          cat << 'YAML' > mcp-gate.yaml
          version: 1
          server:
            name: "anthropic-sqlite-test"
            command: "npx"
            args: ["-y", "@modelcontextprotocol/server-sqlite", "/tmp/test.db"]
            env: {}
            protocol_versions:
              - "2024-11-05"
            workspace:
              source: "."
              mode: "in-place"
          limits:
            startup_timeout_s: 30
            call_timeout_s: 30
            total_timeout_s: 60
            shutdown_grace_s: 3
            max_processes: 64
          policy:
            baseline: "node"
            allow_network: true
            allowed_unix_sockets: []
            allowed_child_binaries: ["node", "npx", "env", "bash", "sh"]
            read_paths:
              - "/tmp"
              - "/usr/local/bin"
              - "/opt/hostedtoolcache/node"
              - "/usr/bin"
              - "/bin"
              - "/usr/lib"
              - "/lib"
              - "/etc"
              - "/home/runner/.npm"
            write_paths:
              - "/tmp"
              - "/home/runner/.npm/_npx"
          YAML

      - name: Run Orchestrator
        run: |
          which node
          which npx
          ls -la $(which npx)
          ls -la $(which node)
          # Create a dummy database and npm dirs
          touch /tmp/test.db
          mkdir -p /home/runner/.npm/_npx
          # Run mcp-gate
          ./target/release/mcp-gate run -c mcp-gate.yaml -v
